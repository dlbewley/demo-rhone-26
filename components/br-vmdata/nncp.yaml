---
apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  # override bridge name in overlay if necessary
  name: br-vmdata
spec:
  desiredState:
    interfaces:
      # override port name in overlay if necessary
      - name: ens224
        ipv4:
          enabled: false
        ipv6:
          enabled: false
        state: up
        # override port type in overlay if necessary
        type: ethernet

      # override bridge name in overlay if necessary
      - name: br-vmdata
        description: |-
          A dedicated OVS bridge with ens224 as a port
          allowing all VLANs and untagged traffic.
          Networks will be mapped to this brige using physnet mapping
        type: ovs-bridge
        state: up
        bridge:
          allow-extra-patch-ports: true
          options:
            stp: false
          port:
            # override port name in overlay if necessary
            - name: ens224
