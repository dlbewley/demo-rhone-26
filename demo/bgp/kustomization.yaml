apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# namespace: demo-cudn-bgp

resources:
  - namespace.yaml
  - clusteruserdefinednetwork.yaml
  - frrconfiguration.yaml
  - routeradvertisements.yaml
  - virtualmachine.yaml

patches:
  - target:
      group: kubevirt.io
      kind: VirtualMachine
      name: .*
      version: v1
    patch: |-
      # rename VM
      - op: replace
        path: /metadata/name
        value: vm-cudn-bgp

      # start VM at creation
      - op: replace
        path: /spec/runStrategy
        value: RerunOnFailure

      # convert default interface from cluster network masquerade
      # to primary UDN l2bridge binding
      - op: replace
        path: /spec/template/spec/domain/devices/interfaces/0
        value: {
          "name": "default",
          "binding": {"name": "l2bridge"},
          "model": "virtio"
        }